;Custom_Subboost_Rules
;参考用户已验证可用的 my_custom_clash_full.ini 调整。
;MetaCubeX 标准分类使用 GEOSITE/GEOIP；自定义苹果推送保留 MRS。
;保留原有 39 个细分组，首组仍为「🚀 节点选择」。
;具体服务域名优先，服务 IP 规则随后，国内 IP 在末尾兜底。
;使用与参考文件相同的 Clash Verge Rev DNS 设置，并开启 TUN + 严格路由。
;无需额外 DNS 分组、DNS 扩展脚本或自定义 DNS 基础模板。
;需使用与参考文件相同且已更新的 GeoSite/GeoIP 数据。

[custom]
;==================== 规则集 ====================
;参考 my_custom_clash_full.ini：标准分类用 GEOSITE/GEOIP，域名规则优先。
;GEOIP 显式 no-resolve，避免为匹配 IP 规则而提前发起 DNS 查询。
;仅自定义苹果推送继续使用两个 MRS 文件；[]FINAL 生成 MATCH。

