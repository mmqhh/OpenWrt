;Custom_Subboost_Rules — Mihomo DNS 防泄漏版
;订阅转换器：Aethersailor/SubConverter-Extended；客户端内核：Mihomo / Clash Meta。
;保留原有业务分组、MRS 规则集来源与匹配顺序。
;[custom] 通过 clash_rule_base 内嵌 DNS 基础配置，单个 INI 即可转换。
;subboost2-base.yaml 是内嵌配置的可读副本；修改后需同步，见 DNS修复说明.md。
;普通网站域名通过「🛡️ DNS 防泄漏」访问境外 DoH；国内 DoH 仅承担订阅/节点引导。
;订阅主机与节点域名使用可直连的引导 DNS，确保 proxy-providers 空缓存时也能下载节点。
;Clash Verge Rev 中开启 TUN，检查 DNS 覆写，并更新远程资源节点。
;Extended 识别 .mrs 并生成 format: mrs；IP 规则使用 86400|no-resolve，不能省略。
;转换参数：target=clash&expand=false&new_name=true；关闭 Script 和仅输出节点模式。
;不适用于未支持 |no-resolve / MRS 的原版 subconverter 或旧版 Clash。

[custom]
;机场订阅含 server=0.0.0.0 的同名占位记录，排除它，避免 DNS 组首选无效节点。
exclude_remarks=^一元机场[.]asia$

