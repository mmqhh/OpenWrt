;==================== 节点分组 ====================
;说明：[]XXX 表示引用其它分组或内置策略(DIRECT/REJECT)；末尾 .* 表示「订阅内全部节点」
;      顺序即生成的 proxies 顺序，与 subboost.yaml 的 proxy-groups 段一致

;入口选择：自动选择 -> 地区组(港/日/美/新/台) -> 直连/拒绝 -> 全部节点
custom_proxy_group=🚀 节点选择`select`[]⚡ 自动选择`[]🇭🇰 香港`[]🇯🇵 日本`[]🇺🇸 美国`[]🇸🇬 新加坡`[]🇼🇸 台湾`[]DIRECT`[]REJECT`.*
;自动测速：全部节点，5gstatic 测速，间隔 300s
custom_proxy_group=⚡ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,0
;地区自动测速：按节点名正则筛选对应地区，测速方式与自动选择一致
custom_proxy_group=🇭🇰 香港`url-test`(🇭🇰|港|HK|hk|[Hh]ong ?[Kk]ong)`https://www.gstatic.com/generate_204`300,,0
custom_proxy_group=🇯🇵 日本`url-test`(🇯🇵|日本|东京|大阪|埼玉|JP|jp|Japan|Tokyo|Osaka)`https://www.gstatic.com/generate_204`300,,0
custom_proxy_group=🇺🇸 美国`url-test`(🇺🇸|美|US|United ?States|America)`https://www.gstatic.com/generate_204`300,,0
custom_proxy_group=🇸🇬 新加坡`url-test`(🇸🇬|新加坡|狮城|坡|SG|sg|Singapore|SINGAPORE|SIN)`https://www.gstatic.com/generate_204`300,,0
custom_proxy_group=🇼🇸 台湾`url-test`(🇹🇼|🇼🇸|台|新北|彰化|TW|tw|Taiwan|TAIWAN|TWN|TPE)`https://www.gstatic.com/generate_204`300,,0
