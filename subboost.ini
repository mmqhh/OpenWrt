;Custom_Subboost_Rules
;由 subboost.yaml 反推而来的 subconverter 订阅转换模板
;反推依据：Custom_Clash_Full.ini -> Custom_Clash_Full.yaml 的映射关系
;规则集来源：MetaCubeX/meta-rules-dat（geosite / geoip，mrs 格式）
;
;【说明】
;1. 本模板仅控制「分流规则(ruleset)」与「节点分组(custom_proxy_group)」，
;   对应 subboost.yaml 中的 rules / rule-providers / proxy-groups 三段。
;2. subboost.yaml 顶部的 mixed-port / dns / sniffer / profile 等基础配置
;   属于 subconverter 全局配置(pref.yml)或 clash_rule_base 基础模板，
;   不在 INI [custom] 段控制范围内，故本模板不包含。
;3. subboost.yaml 的节点为「内联(proxies)」;模板里用 .* 正则表示
;   「订阅中的全部节点」，由 subconverter 在转换时填充。
;4. 以下字段为原生成器行为，标准 subconverter INI 模板无法直接表达：
;   - rule-provider 的 format: mrs（由 subconverter 版本/参数决定）
;   - url-test 的 lazy: false
;   - rule-provider 的命名(如 google-ip 加 -ip 后缀去重)
;   生成时如需完全一致，请在 subconverter 侧配合相应参数。

[custom]
;==================== 规则集 ====================
;说明：clash-domain: -> behavior:domain；clash-ipcidr: -> behavior:ipcidr(自动 no-resolve)
;      []FINAL -> MATCH 漏网之鱼
;顺序与 subboost.yaml 的 rules 段完全一致，从上到下优先命中

